apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: locust
  labels:
    app: locust-master
    cloudport/managed-by: "cloudport-capstone"
spec:
  type: ClusterIP
  selector:
    app: locust-master
  ports:
    - name: web
      port: 8089
      targetPort: 8089
      protocol: TCP
    - name: master-p1
      port: 5557
      targetPort: 5557
      protocol: TCP
    - name: master-p2
      port: 5558
      targetPort: 5558
      protocol: TCP
