# Infrastructure B deployment.
#
# CONTROLLED VARIABLE: CPU resource limits (Kubernetes cgroup enforcement).
#
# Infrastructure A (cloudport-app-a): cpu limit = 2000m  (2 full CPUs)
# Infrastructure B (cloudport-app-b): cpu limit =  200m  (0.2 CPU — 10x more restricted)
#
# This is a GENUINE, KERNEL-ENFORCED infrastructure difference:
#   - The Linux kernel CFS scheduler (via cgroup cpu.cfs_quota_us) enforces the
#     200m limit inside the Kind node container runtime.
#   - The workload (crypto.randomBytes, fs.writeFileSync, process.hrtime)
#     involves CPU-bound operations whose latency IS affected by CPU throttling.
#   - The storage mount path (/data) and PVC are kept identical between A and B
#     to ensure CPU is the ONLY controlled variable.
#
# DO NOT describe this as storage throttling. The controlled variable is COMPUTE.
# The experiment manifest (cpu-resource-isolation-v1.json) reflects this accurately.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudport-app-b
  namespace: cloudport
  labels:
    app: cloudport-app-b
    cloudport.io/infrastructure: variant-b

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cloudport-app-b

  template:
    metadata:
      labels:
        app: cloudport-app-b
        cloudport.io/infrastructure: variant-b

    spec:
      containers:
        - name: cloudport-app
          image: cloudport:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4000

          env:
            - name: PORT
              value: "4000"

            - name: APP_VERSION
              value: "cloudport:1.0.0"

            - name: INFRA_IDENTITY
              value: "infrastructure-b"

            - name: CLOUDPORT_STORAGE_MOUNT
              value: "/data"

            - name: DATABASE_URL
              value: "postgres://cloudport:changeme@host.docker.internal:5432/cloudport"

          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"       # 5x lower request than Infrastructure A (500m -> 100m)
              memory: "512Mi"
            limits:
              cpu: "200m"       # THE CONTROLLED VARIABLE: 10x lower limit than Infra A (2000m -> 200m)
              memory: "4Gi"     # Memory limit kept identical -- not a controlled variable

          volumeMounts:
            - name: storage
              mountPath: /data

      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: cloudport-storage-b